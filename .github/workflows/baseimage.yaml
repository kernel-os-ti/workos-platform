# Build the base images that service Dockerfiles `FROM`. Publishes to GHCR
# under ghcr.io/<owner>/{base,base-slim,rekoni-base,print-base,front-base,preview-base}:$VERSION.

name: Docker base image

concurrency:
  group: 'service-base'
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the images (e.g. v20260512)'
        required: true
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Configure docker
        uses: crazy-max/ghaction-setup-docker@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: tree:0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Docker build
        run: |
          cd ./dev/base-image
          ./build.sh
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_EXTRA: --platform=linux/amd64,linux/arm64
          VERSION: ${{ inputs.version }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish base images to GHCR
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_NAMESPACE: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NAMESPACE=$(echo "$DOCKER_NAMESPACE" | tr '[:upper:]' '[:lower:]')
          for name in base base-slim rekoni-base print-base front-base preview-base; do
            src="hardcoreeng/${name}:${VERSION}"
            dst="${DOCKER_REGISTRY}/${NAMESPACE}/${name}:${VERSION}"
            echo "Tagging $src -> $dst"
            docker tag "$src" "$dst"
            for n in {1..25}; do
              docker push "$dst" && break
              if [ $n -lt 25 ]; then
                echo "push failed, retry in 5s"
                sleep 5
              else
                echo "push failed after 25 attempts" >&2
                exit 1
              fi
            done
          done

